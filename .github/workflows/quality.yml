name: Code quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Check lint rules
        run: uv run --frozen --no-sync ruff check .
      - name: Check formatting
        run: uv run --frozen --no-sync ruff format --check .

  types:
    name: Types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Check types
        run: uv run --frozen --no-sync ty check --error-on-warning
