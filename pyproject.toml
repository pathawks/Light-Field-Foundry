[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "light-field-foundry"
version = "0.1.0"
description = "Develop Lytro captures into exact RGB16 Portrait and Spatial AVIF images"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2",
  "tifffile>=2025.1.10",
  "imagecodecs>=2025.11.11",
  "pillow>=11.1",
  "pypng>=0.20220715.0",
  "typer>=0.16",
  "rich>=14",
]

[project.scripts]
lff = "light_field_foundry.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11", "ty>=0.0.1a14"]

[tool.uv.build-backend]
source-include = [".python-version", "tests/**", "uv.lock"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native: exercises installed native codecs", "external: requires user-supplied capture/calibration"]

[tool.ty.environment]
python-version = "3.12"

