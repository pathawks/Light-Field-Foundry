[build-system]
requires = ["uv_build==0.13.5", "kaitaistruct==0.11.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "light-field-foundry"
version = "0.1.0"
description = "Develop Lytro captures into exact RGB16 Portrait and Spatial AVIF images"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2",
  "tifffile>=2025.1.10",
  "imagecodecs>=2025.11.11",
  "pillow>=11.1",
  "pypng>=0.20220715.0",
  "typer>=0.16",
  "rich>=14",
  "kaitaistruct==0.11.0",
]

[project.scripts]
lff = "light_field_foundry.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.17.2", "ty>=0.0.91"]

[tool.uv.build-backend]
source-include = [".python-version", "tests/**", "uv.lock", "build_backend.py", "formats/**"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "build_backend.py" },
  { file = "formats/**" },
  { file = "src/light_field_foundry/_generated/**" },
]

[tool.kaitai]
compiler-version = "0.11.0"

[tool.ruff]
target-version = "py312"
line-length = 100
required-version = ">=0.17.2"

[tool.ruff.lint]
# Explicit rule families keep upgrades reviewable and avoid formatter conflicts.
select = [
  "E4", "E7", "E9", "F", "I", "UP", "B", "SIM",
  "ANN",                         # Require annotated arguments and return values.
  "A", "ASYNC", "C4", "DTZ", "EXE", "FA", "ICN", "ISC", "LOG", "PIE",
  "PLC", "PLE", "PLW",          # Pylint correctness, conventions, and warnings.
  "PT", "PYI", "RET", "RSE", "RUF", "S", "T10", "T20", "TID", "YTT",
]
allowed-confusables = ["×"]       # Dimension labels use the multiplication sign.

[tool.ruff.lint.per-file-ignores]
# Generated output is verified against the pinned compiler in its own workflow.
"src/light_field_foundry/_generated/lfp_framing.py" = ["ALL"]
# Assertions and imports inside test cases are deliberate pytest idioms.
"tests/**" = ["S101", "PLC0415"]

[tool.ruff.format]
exclude = ["src/light_field_foundry/_generated/lfp_framing.py"]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native: exercises installed native codecs", "external: requires user-supplied capture/calibration"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "build_backend.py"]
exclude = ["src/light_field_foundry/_generated/lfp_framing.py"]

[tool.ty.rules]
# Includes opt-in checks for Any/Unknown leakage and missing generic arguments.
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.terminal]
error-on-warning = true

